<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hesap Makinesi</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="calculator-container">
    <div class="calculator-header">
      <i class="fa-solid fa-calculator"></i>
      <h1>Hesap Makinesi</h1>
    </div>
    
    <div class="display-screen">
      <div id="history" class="history-text"></div>
      <div id="display" class="current-text">0</div>
    </div>

    <div class="buttons-grid">
      <button class="btn btn-action" onclick="clearDisplay()">AC</button>
      <button class="btn btn-action" onclick="deleteLast()"><i class="fa-solid fa-backspace"></i></button>
      <button class="btn btn-action" onclick="appendOperator('%')">%</button>
      <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>

      <button class="btn" onclick="appendNumber('7')">7</button>
      <button class="btn" onclick="appendNumber('8')">8</button>
      <button class="btn" onclick="appendNumber('9')">9</button>
      <button class="btn btn-operator" onclick="appendOperator('*')">×</button>

      <button class="btn" onclick="appendNumber('4')">4</button>
      <button class="btn" onclick="appendNumber('5')">5</button>
      <button class="btn" onclick="appendNumber('6')">6</button>
      <button class="btn btn-operator" onclick="appendOperator('-')">−</button>

      <button class="btn" onclick="appendNumber('1')">1</button>
      <button class="btn" onclick="appendNumber('2')">2</button>
      <button class="btn" onclick="appendNumber('3')">3</button>
      <button class="btn btn-operator" onclick="appendOperator('+')">+</button>

      <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
      <button class="btn" onclick="appendNumber('.')">,</button>
      <button class="btn btn-equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
